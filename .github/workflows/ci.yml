# Every pull request and every push to main: type check, the full test suite
# and the build. Played-season fixtures are cached by the engine's hash, as
# tests/fixtures.ts keys them, so a run with an unchanged engine is fast.
name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/nfl-fixtures
          key: fixtures-${{ hashFiles('src/engine/**', 'src/save/**', 'data/**') }}
          restore-keys: fixtures-
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
